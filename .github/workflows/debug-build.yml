# CI/CD: Диагностика сборки «Моё дело»
# Временный workflow для поиска ошибок

name: Debug Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  # Диагностика Go-бэкенда
  backend-check:
    name: 🔍 Проверка Go-бэкенда
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Исходный код
        uses: actions/checkout@v4

      - name: 📂 Проверка структуры
        run: |
          echo "=== Структура проекта ==="
          ls -la
          echo ""
          echo "=== Backend файлы ==="
          ls -la backend/ || echo "❌ Backend директория не найдена"
          echo ""
          echo "=== Go модули ==="
          cat backend/go.mod || echo "❌ go.mod не найден"
          echo ""
          echo "=== Go sum ==="
          cat backend/go.sum || echo "❌ go.sum не найден"

      - name: 🐹 Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 📦 Установка зависимостей
        working-directory: ./backend
        run: |
          echo "=== Go mod tidy ==="
          go mod tidy
          echo ""
          echo "=== Go mod download ==="
          go mod download
          echo ""
          echo "=== Проверка go.sum ==="
          ls -lh go.sum

      - name: 🔍 Проверка синтаксиса
        working-directory: ./backend
        run: |
          echo "=== Go vet ==="
          go vet ./... 2>&1 || echo "⚠️ Go vet нашёл проблемы"
          echo ""
          echo "=== Go fmt ==="
          go fmt ./... || echo "⚠️ Go fmt нашёл проблемы"

      - name: 🏗 Сборка сервера
        working-directory: ./backend
        run: |
          echo "=== Сборка cmd/server ==="
          go build -v -o moe-delo-server ./cmd/server/ 2>&1
          echo ""
          echo "=== Проверка бинарника ==="
          ls -lh moe-delo-server || echo "❌ Бинарник не создан"

      - name: 🏗 Сборка утилит
        working-directory: ./backend
        run: |
          echo "=== Сборка cmd/seed ==="
          go build -v -o seed ./cmd/seed/ 2>&1 || echo "⚠️ Seed не собрался"
          echo ""
          echo "=== Сборка cmd/admin ==="
          go build -v -o admin ./cmd/admin/ 2>&1 || echo "⚠️ Admin не собрался"
          echo ""
          echo "=== Сборка cmd/health ==="
          go build -v -o health ./cmd/health/ 2>&1 || echo "⚠️ Health не собрался"

  # Диагностика Flutter (упрощённая)
  flutter-check:
    name: 🔍 Проверка Flutter
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Исходный код
        uses: actions/checkout@v4

      - name: 📂 Проверка структуры
        run: |
          echo "=== Mobile файлы ==="
          ls -la mobile/ || echo "❌ Mobile директория не найдена"
          echo ""
          echo "=== pubspec.yaml ==="
          cat mobile/pubspec.yaml || echo "❌ pubspec.yaml не найден"

      - name: 🐦 Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 📦 Установка зависимостей
        working-directory: ./mobile
        run: |
          echo "=== Flutter pub get ==="
          flutter pub get 2>&1
          echo ""
          echo "=== Flutter doctor ==="
          flutter doctor -v

      - name: 🔍 Анализ кода
        working-directory: ./mobile
        continue-on-error: true
        run: |
          echo "=== Flutter analyze ==="
          flutter analyze --no-fatal-infos 2>&1 || echo "⚠️ Анализ нашёл проблемы"

      - name: 🏗 Тестовая сборка
        working-directory: ./mobile
        continue-on-error: true
        run: |
          echo "=== Попытка сборки APK ==="
          flutter build apk --release 2>&1 || echo "⚠️ APK не собрался"
          echo ""
          echo "=== Проверка build директории ==="
          ls -lh build/app/outputs/flutter-apk/ 2>&1 || echo "❌ APK не создан"

  # Итоговая сводка
  summary:
    name: 📊 Итоговая сводка
    runs-on: ubuntu-latest
    needs: [backend-check, flutter-check]
    if: always()
    steps:
      - name: 📋 Результаты
        run: |
          echo "=== Результаты сборки ==="
          echo "Backend: ${{ needs.backend-check.result }}"
          echo "Flutter: ${{ needs.flutter-check.result }}"
          echo ""
          if [[ "${{ needs.backend-check.result }}" == "success" && "${{ needs.flutter-check.result }}" == "success" ]]; then
            echo "✅ Всё успешно!"
          else
            echo "⚠️ Есть проблемы — смотри логи выше"
          fi
